# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "v10.0" ]
  pull_request:
    branches: [ "v10.0" ]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test --configuration Release --verbosity normal --no-build

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        path: /home/runner/work/Invicta.Numerics.Vectors/Invicta.Numerics.Vectors/Invicta.Numerics.Vectors/bin/Release/Invicta.Numerics.Vectors.*.nupkg
        archive: false
